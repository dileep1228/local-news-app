[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version="0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "chrono"
]}
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }